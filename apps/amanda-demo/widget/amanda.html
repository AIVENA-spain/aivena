<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Chat</title>
<style>
  :root { --brand:#0B7C3A; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e6e6; --bg:#ffffff; --bot:#f4f5f4; }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:transparent; }
  body { font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); }
  .wrap { max-width:420px; margin:0 auto; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; }
  .hd { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .hd .logo { width:34px; height:34px; border-radius:50%; object-fit:cover; background:var(--brand); flex:0 0 auto; }
  .avatar { width:34px; height:34px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg, var(--brand), #0e5a6e); color:#fff; font-weight:700; font-size:15px; letter-spacing:.02em;
            box-shadow:0 2px 6px rgba(11,124,58,.25); }
  .avatar.sm { width:24px; height:24px; font-size:11px; box-shadow:none; align-self:flex-end; }
  .brow { display:flex; gap:7px; align-items:flex-end; max-width:92%; }
  .brow .m.bot { max-width:100%; }
  .typing { display:inline-flex; gap:4px; padding:10px 12px; background:var(--bot); border-radius:12px; border-bottom-left-radius:4px; }
  .typing i { width:6px; height:6px; border-radius:50%; background:#9aa39d; animation:tp 1.1s infinite ease-in-out; }
  .typing i:nth-child(2){ animation-delay:.15s } .typing i:nth-child(3){ animation-delay:.3s }
  @keyframes tp { 0%,60%,100%{ transform:translateY(0); opacity:.5 } 30%{ transform:translateY(-4px); opacity:1 } }
  .hd .who { font-weight:600; font-size:14px; }
  .hd .sub { font-size:11px; color:var(--muted); }
  .disc { padding:10px 14px; background:#fbfbf8; border-bottom:1px solid var(--line); font-size:11.5px; color:#444; line-height:1.45; }
  .disc b { color:var(--ink); font-weight:600; }
  .notice { margin-top:6px; color:var(--muted); font-size:11px; }
  .notice a, .disc a { color:var(--brand); }
  .msgs { padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-height:120px; }
  .m { max-width:85%; padding:8px 11px; border-radius:12px; font-size:13.5px; white-space:pre-wrap; word-wrap:break-word; }
  .m.bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .m.me  { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
  .card { align-self:stretch; border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; }
  .card h4 { margin:0 0 6px; font-size:13px; }
  .card .cn { font-size:11.5px; color:#444; line-height:1.45; margin-bottom:10px; }
  .card input[type=text] { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; margin-bottom:8px; }
  .consent { display:flex; gap:8px; align-items:flex-start; font-size:12px; color:#333; margin:6px 0 10px; }
  .consent input { margin-top:2px; }
  .card button, .inp button { background:var(--brand); color:#fff; border:0; border-radius:9px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .card button[disabled] { opacity:.45; cursor:not-allowed; }
  .inp { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  .inp input { flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:9px; font-size:13px; }
  .ok { align-self:center; color:var(--brand); font-size:12px; font-weight:600; padding:4px 0; }
  .pcards { align-self:stretch; display:flex; flex-direction:column; gap:8px; }
  .pcard { display:flex; gap:10px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .pcard .thumb { width:84px; min-height:74px; background:#eef0ee center/cover no-repeat; flex:0 0 auto; }
  .pcard .pc { padding:8px 10px; min-width:0; flex:1; }
  .pcard .pt { font-size:12.5px; font-weight:600; line-height:1.25; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .pcard .pm { font-size:11px; color:var(--muted); }
  .pcard .pp { font-size:13px; font-weight:700; color:var(--ink); margin-top:3px; }
  .pcard a.pv { font-size:11px; color:var(--brand); text-decoration:none; }
  .demo-tag { font-size:10px; color:#b26a00; background:#fff6e6; border:1px solid #ffe0a3; border-radius:6px; padding:1px 6px; margin-left:6px; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="hd">
      <img class="logo" id="logo" alt="" />
      <span class="avatar" id="avatarHd" style="display:none" aria-hidden="true">A</span>
      <div>
        <div class="who" id="who">Assistant<span id="demoTag"></span></div>
        <div class="sub" id="sub">Automated assistant</div>
      </div>
    </div>
    <div class="disc" id="disc"></div>
    <div class="msgs" id="msgs"></div>
    <div class="inp" id="inpRow">
      <input id="inp" type="text" autocomplete="off" placeholder="Type a message…" />
      <button id="send" type="button">Send</button>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var AGENCY = (Q.get("agency") || "").slice(0, 100);
  var RAWLANG = (Q.get("lang") || "en").toLowerCase();
  var LANG = RAWLANG === "es" ? "es" : "en";          // only en/es approved; else fall back to en
  var NAME = (Q.get("name") || "").slice(0, 80);
  var COLOR = Q.get("color");
  var LOGO = Q.get("logo");
  var PRIVACY = Q.get("privacy") || "https://aivena.es/privacy";
  var API = Q.get("api") || "https://aivena-production.up.railway.app";
  var DEMO = Q.get("demo") === "1" || Q.get("demo") === "contact";

  var A = NAME || "this agency";  // [Agency] merge token
  if (COLOR && /^#[0-9a-fA-F]{3,8}$/.test(COLOR)) document.documentElement.style.setProperty("--brand", COLOR);

  // ── Canonical approved copy (Packet-1). Legal lines: en/es only. ─────────────
  var T = {
    en: {
      who: "Amanda · " + A,
      sub: "AI assistant · automated system — not a person",
      disclosure: "You're chatting with <b>" + esc(A) + "</b>'s AI assistant — an automated system, not a person. A team member can take over at any time; just ask.",
      notice: 'By chatting here you agree that ' + esc(A) + ' (with AIVENA as data processor) may process this conversation to help with your enquiry. See the <a href="' + escAttr(PRIVACY) + '" target="_blank" rel="noopener">Privacy Policy</a>.',
      greeting: "Hi! I'm " + A + "'s assistant. Ask me anything about our properties or the area — or I can have the team reach out to you. What are you looking for?",
      placeholder: "Type a message…",
      send: "Send",
      cardTitle: "Share your contact details",
      contactNotice: "To reply and follow up, " + esc(A) + " (with AIVENA as data processor) will process the details you share. Legal basis: your consent. We don't sell your data or share it for third parties' own purposes. Withdraw consent or exercise your rights (access, rectification, erasure, objection, portability, restriction) at privacy@aivena.es.",
      checkbox: "I accept that " + A + " processes the details I share to reply to my enquiry and follow up.",
      name: "Name", email: "Email", phone: "Phone",
      submit: "Send to the team",
      done: "Thank you! The team will be in touch shortly.",
      doneHuman: "Thanks — the team will message you on WhatsApp as soon as they can. I'm still here if you'd like to keep looking meanwhile.",
      err: "Sorry — something went wrong. Please try again.",
      needField: "Please add an email or phone."
    },
    es: {
      who: "Amanda · " + A,
      sub: "Asistente de IA · sistema automatizado — no es una persona",
      disclosure: "Está hablando con el asistente de IA de <b>" + esc(A) + "</b>, un sistema automatizado, no una persona. Un miembro del equipo puede intervenir en cualquier momento; solo tiene que pedirlo.",
      notice: 'Al chatear aquí, acepta que ' + esc(A) + ' (con AIVENA como encargado del tratamiento) pueda tratar esta conversación para atender su consulta. Consulte la <a href="' + escAttr(PRIVACY) + '" target="_blank" rel="noopener">Política de Privacidad</a>.',
      greeting: "¡Hola! Soy el asistente de " + A + ". Pregúnteme lo que quiera sobre nuestras propiedades o la zona — o puedo pedir al equipo que le contacte. ¿Qué está buscando?",
      placeholder: "Escriba un mensaje…",
      send: "Enviar",
      cardTitle: "Comparta sus datos de contacto",
      contactNotice: "Para responderle y hacer seguimiento, " + esc(A) + " (con AIVENA como encargado del tratamiento) tratará los datos que comparta. Base jurídica: su consentimiento. No vendemos sus datos ni los cedemos para fines propios de terceros. Puede retirar su consentimiento o ejercer sus derechos (acceso, rectificación, supresión, oposición, portabilidad y limitación) en privacy@aivena.es.",
      checkbox: "Acepto que " + A + " trate los datos que comparto para responder a mi consulta y hacer seguimiento.",
      name: "Nombre", email: "Email", phone: "Teléfono",
      submit: "Enviar al equipo",
      done: "¡Gracias! El equipo le contactará en breve.",
      doneHuman: "Gracias — el equipo le escribirá por WhatsApp lo antes posible. Sigo aquí por si quiere seguir mirando mientras tanto.",
      err: "Lo sentimos — algo salió mal. Inténtelo de nuevo.",
      needField: "Añada un email o teléfono."
    }
  }[LANG];

  // exact verbatim consent_text stored in consent_log = notice + checkbox label shown
  var CONSENT_TEXT = T.contactNotice + "\n\n[x] " + T.checkbox;
  var CONSENT_METHOD = "explicit_checkbox|" + LANG + "|v1";

  var sessionToken = getSession();
  var collected = {};
  var contactShown = false;
  var pendingViewing = { active: false, ref: null };  // set when Amanda asks for contact to confirm a viewing
  var pendingHuman = false;                            // set when the visitor asks for a person (AI pauses after capture)
  var DEMO_CARDS = [
    { type:'property', ref:'MCH-001', title:'2-bedroom apartment near Playa del Cura, Torrevieja', propertyType:'apartment', price:128000, currency:'EUR', bedrooms:2, bathrooms:1, areaSqm:70, locationCity:'Torrevieja', url:'#', image:null },
    { type:'property', ref:'MCH-002', title:'2-bedroom apartment with sea views, Torrevieja', propertyType:'apartment', price:165000, currency:'EUR', bedrooms:2, bathrooms:2, areaSqm:78, locationCity:'Torrevieja', url:'#', image:null },
    { type:'property', ref:'MCH-003', title:'3-bedroom apartment in Torrevieja centre', propertyType:'apartment', price:185000, currency:'EUR', bedrooms:3, bathrooms:2, areaSqm:95, locationCity:'Torrevieja', url:'#', image:null }
  ];

  // ── DOM ──────────────────────────────────────────────────────────────────
  var msgs = document.getElementById("msgs");
  var inp = document.getElementById("inp");
  var sendBtn = document.getElementById("send");
  document.getElementById("who").firstChild.nodeValue = T.who;
  document.getElementById("sub").textContent = T.sub;
  document.getElementById("disc").innerHTML =
    T.disclosure + '<div class="notice">' + T.notice + "</div>";
  inp.placeholder = T.placeholder;
  sendBtn.textContent = T.send;
  var logoEl = document.getElementById("logo");
  if (LOGO && /^https:\/\//.test(LOGO)) { logoEl.src = LOGO; } else { logoEl.style.display = "none"; document.getElementById("avatarHd").style.display = "flex"; }
  if (DEMO) document.getElementById("demoTag").outerHTML = '<span class="demo-tag">demo</span>';

  botMsg(T.greeting);
  if (Q.get("demo") === "contact") showContactCard();
  if (Q.get("demo") === "cards") {
    botMsg(LANG === "es" ? "Aquí tiene 3 que encajan. Un agente puede darle más detalles o concertar una visita."
                         : "Here are 3 listings that match. An agent can tell you more or arrange a viewing.");
    renderCards(DEMO_CARDS);
  }

  sendBtn.addEventListener("click", onSend);
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") onSend(); });

  function onSend() {
    var text = (inp.value || "").trim();
    if (!text) return;
    meMsg(text);
    inp.value = "";
    if (DEMO) { demoReply(text); return; }
    showTyping();
    postJSON(API + "/chat/" + encodeURIComponent(AGENCY) + "/message", {
      sessionToken: sessionToken, message: text, language: LANG
    }).then(function (r) {
      hideTyping();
      if (!r || r.ok !== true) { botMsg(T.err); return; }
      if (r.collected) collected = Object.assign({}, r.collected);
      if (r.reply) botMsg(r.reply);
      if (r.attachments && r.attachments.length) renderCards(r.attachments);
      if (r.messageType === "viewing_request") pendingViewing = { active: true, ref: r.viewingRef || null };
      if (r.messageType === "human_defer" || r.human === true) pendingHuman = true;
      if (r.awaitingContact && !contactShown) showContactCard();
      if (r.captured) done();
    }).catch(function () { hideTyping(); botMsg(T.err); });
  }

  // ── Contact card (explicit unticked consent checkbox; submit gated) ─────────
  function showContactCard() {
    contactShown = true;
    var card = document.createElement("div");
    card.className = "card";
    card.setAttribute("data-testid", "contact-card");

    var h = document.createElement("h4"); h.textContent = T.cardTitle; card.appendChild(h);
    var cn = document.createElement("div"); cn.className = "cn"; cn.textContent = T.contactNotice; card.appendChild(cn);

    var fName = field("text", T.name), fEmail = field("text", T.email), fPhone = field("text", T.phone);
    card.appendChild(fName); card.appendChild(fEmail); card.appendChild(fPhone);

    var cw = document.createElement("label"); cw.className = "consent";
    var cb = document.createElement("input"); cb.type = "checkbox"; cb.setAttribute("data-testid", "consent-checkbox"); // UNTICKED by default
    var cl = document.createElement("span"); cl.textContent = T.checkbox;
    cw.appendChild(cb); cw.appendChild(cl); card.appendChild(cw);

    var btn = document.createElement("button"); btn.type = "button"; btn.textContent = T.submit;
    btn.disabled = true; btn.setAttribute("data-testid", "contact-submit");
    card.appendChild(btn);
    msgs.appendChild(card); scroll();

    function refresh() {
      var hasContact = fEmail.value.trim() || fPhone.value.trim() || fName.value.trim();
      btn.disabled = !(cb.checked && hasContact);   // submit stays disabled until ticked
    }
    cb.addEventListener("change", refresh);
    [fName, fEmail, fPhone].forEach(function (f) { f.addEventListener("input", refresh); });

    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      if (!(fEmail.value.trim() || fPhone.value.trim())) { botMsg(T.needField); return; }
      btn.disabled = true;
      var body = Object.assign({}, collected, {
        sessionToken: sessionToken, language: LANG, consent: true,
        consentText: CONSENT_TEXT, consentMethod: CONSENT_METHOD,
        name: fName.value.trim() || null, email: fEmail.value.trim() || null, phone: fPhone.value.trim() || null,
        context: { pageUrl: document.referrer || location.href, referrer: document.referrer || "" },
        viewing: pendingViewing.active, viewingRef: pendingViewing.ref, human: pendingHuman
      });
      if (DEMO) { card.remove(); done(); return; }
      postJSON(API + "/chat/" + encodeURIComponent(AGENCY) + "/contact", body).then(function (r) {
        if (r && r.ok === true) { card.remove(); done(); }
        else { botMsg((r && r.error) || T.err); btn.disabled = false; }
      }).catch(function () { botMsg(T.err); btn.disabled = false; });
    });
    refresh();
  }

  // ── helpers ────────────────────────────────────────────────────────────────
  function field(type, ph) { var i = document.createElement("input"); i.type = type; i.placeholder = ph; return i; }

  // Property cards (Phase B) — every field is a verbatim value from a verified active
  // listing; capped at 3. No card is shown unless the server returned it.
  function renderCards(cards) {
    if (!cards || !cards.length) return;
    var wrap = document.createElement("div"); wrap.className = "pcards"; wrap.setAttribute("data-testid", "property-cards");
    cards.slice(0, 3).forEach(function (c) {
      var el = document.createElement("div"); el.className = "pcard";
      if (c.url && c.url !== "#") {
        el.style.cursor = "pointer";
        el.addEventListener("click", function (ev) {
          if (ev.target && ev.target.tagName === "A") return;   // the link handles itself
          window.open(c.url, "_blank", "noopener");
        });
      }
      if (c.image) { var th = document.createElement("div"); th.className = "thumb"; th.style.backgroundImage = "url('" + encodeURI(c.image) + "')"; el.appendChild(th); }
      var pc = document.createElement("div"); pc.className = "pc";
      var pt = document.createElement("div"); pt.className = "pt"; pt.textContent = c.title || c.ref || "Property"; pc.appendChild(pt);
      var meta = [];
      if (c.propertyType) meta.push(cap(c.propertyType));
      if (c.locationCity) meta.push(c.locationCity);
      if (c.bedrooms != null) meta.push(c.bedrooms + (LANG === "es" ? " hab" : " bed"));
      if (c.bathrooms != null) meta.push(c.bathrooms + (LANG === "es" ? " baños" : " bath"));
      if (c.areaSqm != null) meta.push(c.areaSqm + " m²");
      var pm = document.createElement("div"); pm.className = "pm"; pm.textContent = meta.join(" · "); pc.appendChild(pm);
      if (c.features && c.features.length) {
        var pf = document.createElement("div"); pf.className = "pm"; pf.style.marginTop = "2px";
        pf.textContent = "✓ " + c.features.slice(0, 4).join(" · ");
        pc.appendChild(pf);
      }
      if (c.price != null) { var pp = document.createElement("div"); pp.className = "pp"; pp.textContent = fmtPrice(c.price, c.currency); pc.appendChild(pp); }
      if (c.url && c.url !== "#") { var a = document.createElement("a"); a.className = "pv"; a.href = c.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = LANG === "es" ? "Ver detalles" : "View details"; pc.appendChild(a); }
      el.appendChild(pc); wrap.appendChild(el);
    });
    msgs.appendChild(wrap); scroll();
  }
  function cap(s) { return String(s).charAt(0).toUpperCase() + String(s).slice(1); }
  function fmtPrice(n, ccy) {
    var sym = ccy === "GBP" ? "£" : ccy === "USD" ? "$" : "€";
    try { return sym + Number(n).toLocaleString(LANG === "es" ? "es-ES" : "en-GB"); } catch (e) { return sym + n; }
  }
  function botMsg(t) {
    var row = document.createElement("div"); row.className = "brow";
    var av = document.createElement("span"); av.className = "avatar sm"; av.textContent = "A"; av.setAttribute("aria-hidden", "true");
    var d = document.createElement("div"); d.className = "m bot"; d.textContent = t;
    row.appendChild(av); row.appendChild(d); msgs.appendChild(row); scroll();
  }
  var typingEl = null;
  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div"); typingEl.className = "brow";
    var av = document.createElement("span"); av.className = "avatar sm"; av.textContent = "A"; av.setAttribute("aria-hidden", "true");
    var t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    typingEl.appendChild(av); typingEl.appendChild(t); msgs.appendChild(typingEl); scroll();
  }
  function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }
  function meMsg(t) { var d = document.createElement("div"); d.className = "m me"; d.textContent = t; msgs.appendChild(d); scroll(); }
  function done() { var d = document.createElement("div"); d.className = "ok"; d.textContent = pendingHuman ? T.doneHuman : T.done; msgs.appendChild(d); if (!pendingHuman) { inp.disabled = true; sendBtn.disabled = true; } scroll(); }
  function scroll() { window.scrollTo(0, document.body.scrollHeight); postHeight(); }
  function postHeight() {
    try {
      var h = document.getElementById("wrap").getBoundingClientRect().height + 8;
      parent.postMessage({ type: "aivena-amanda-height", height: h }, "*");
    } catch (e) {}
  }
  function postJSON(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) { return res.json().catch(function () { return { ok: false }; }); });
  }
  function getSession() {
    try {
      var k = "aivena_amanda_" + AGENCY, v = sessionStorage.getItem(k);
      if (!v) { v = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2); sessionStorage.setItem(k, v); }
      return v;
    } catch (e) { return String(Date.now()); }
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function escAttr(s) { return esc(s); }

  // Offline demo replies (only with ?demo=1) — canned, so the full UI (incl. the
  // consent-gated contact card) can be verified without a live API.
  var demoStep = 0;
  function demoReply(text) {
    var qs = LANG === "es"
      ? ["¿Qué zona le interesa?", "¿Cuál es su presupuesto (aproximado)?", "¿Cuántos dormitorios necesita?", "¿Qué tipo de propiedad?"]
      : ["Which area are you interested in?", "What's your budget (roughly)?", "How many bedrooms do you need?", "What type of property?"];
    if (demoStep < qs.length) { botMsg("(demo) " + qs[demoStep]); demoStep++; }
    else if (!contactShown) { botMsg(LANG === "es" ? T.contactNotice.slice(0, 0) + "…" : "Great — let's get your details."); showContactCard(); }
  }

  postHeight();
  window.addEventListener("load", postHeight);
})();
</script>
</body>
</html>
